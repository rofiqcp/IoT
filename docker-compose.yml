version: "3.8"

# =============================================================
# IoT Enterprise Platform — Full Stack Docker Compose
# =============================================================
# Usage:  docker-compose up -d
#
# Devices (ESP32 / Python Mini PC) connect directly to EMQX.
# The Bridge service moves data between EMQX ↔ Kafka.
# The Backend consumes from Kafka and serves the React frontend.
# =============================================================

services:

  # ------ EMQX (MQTT Broker) ------
  emqx:
    image: emqx/emqx:5.6.1
    container_name: emqx
    ports:
      - "1883:1883"     # MQTT
      - "8083:8083"     # WebSocket
      - "18083:18083"   # Dashboard
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 0.0.0.0
      EMQX_LOADED_PLUGINS: "emqx_dashboard"
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    volumes:
      - emqx_data:/opt/emqx/data
    networks:
      - iot-net
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------ Zookeeper (for Kafka) ------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
    networks:
      - iot-net

  # ------ Kafka ------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168           # 7 days
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - iot-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ------ Cassandra ------
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: IoTPlatform
      CASSANDRA_DC: datacenter1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./cassandra/init.cql:/docker-entrypoint-initdb.d/init.cql
    networks:
      - iot-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 10

  # ------ Cassandra Init (run CQL schema once) ------
  cassandra-init:
    image: cassandra:4.1
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/init.cql:/init.cql
    entrypoint: >
      bash -c "
        echo 'Waiting for Cassandra...' &&
        sleep 10 &&
        cqlsh cassandra 9042 -f /init.cql &&
        echo 'Schema initialized!'
      "
    networks:
      - iot-net
    restart: "no"

  # ------ MQTT-Kafka Bridge ------
  bridge:
    build: ./bridge
    container_name: bridge
    depends_on:
      - emqx
      - kafka
    environment:
      BRIDGE_CONFIG: /app/config.yaml
    volumes:
      - bridge_buffer:/tmp/bridge_buffer
    networks:
      - iot-net
    restart: always

  # ------ Spring Boot Backend ------
  backend:
    build: ./backend
    container_name: backend
    depends_on:
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - iot-net
    restart: always

  # ------ React Frontend ------
  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - iot-net
    restart: always

  # ------ Python Device Agent (example mini PC device) ------
  device-agent:
    build: ./device-agent
    container_name: device-agent
    depends_on:
      - emqx
    environment:
      DEVICE_CONFIG: /app/config.yaml
    networks:
      - iot-net
    restart: always

volumes:
  emqx_data:
  zk_data:
  kafka_data:
  cassandra_data:
  bridge_buffer:

networks:
  iot-net:
    driver: bridge
